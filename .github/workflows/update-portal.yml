name: Update portal from site feeds

on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/sources.json'
      - 'scripts/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/update-portal.yml'
  workflow_dispatch:

concurrency:
  group: update-portal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build portal shell
        run: python scripts/build.py
      - name: Fetch and merge site feeds
        run: python scripts/merge_feeds.py
      - name: Run tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Export offline preview
        run: python scripts/export_preview.py
      - name: Sync generated files
        run: |
          cp dist/data/portal.json dist/data/portal-local.json docs/data/
          cp dist/preview.html preview.html
          cp dist/preview.html docs/preview.html
          rsync -a dist/assets/ docs/assets/
      - name: Commit generated changes
        run: |
          git add -A docs preview.html
          if git diff --cached --quiet; then
            echo 'No portal changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update portal from site feeds'
            git push origin HEAD:main
          fi
